name: Build Pygame (artifact only)

# 仅负责构建并上传产物作为备份；实际部署由本地 netlify-cli 完成（见 netlify.toml）。
# 不再使用 GitHub Pages 部署，也不再推送 assets 分支到 jsdelivr/Gitee。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygbag==0.9.3

      - name: Build with pygbag
        run: |
          python -m pygbag --build --app_name tank_battle --title "坦克大战" --can_close 1 .

      - name: Clean private files & normalize archive
        run: |
          cd build/web
          for f in "坦克大战.apk" "tank-battle.apk" "tank_battle.apk"; do
            [ -f "$f" ] && [ "$f" != "tank_battle.apk" ] && mv -f "$f" "tank_battle.apk" || true
          done
          for f in "坦克大战.tar.gz" "tank-battle.tar.gz" "tank_battle.tar.gz"; do
            [ -f "$f" ] && [ "$f" != "tank_battle.tar.gz" ] && mv -f "$f" "tank_battle.tar.gz" || true
          done
          python3 - <<'PY'
          p = "index.html"
          s = open(p, encoding="utf-8").read()
          for a, b in [('坦克大战.apk','tank_battle.apk'),('坦克大战.tar.gz','tank_battle.tar.gz'),
                       ('bundle = "坦克大战"','bundle = "tank_battle"'),('archive : "坦克大战"','archive : "tank_battle"')]:
              s = s.replace(a, b)
          open(p, "w", encoding="utf-8").write(s)
          print("index.html fixed")
          PY
          python3 - <<'PY'
          import tarfile, io, os
          apk = "tank_battle.tar.gz"
          if not os.path.exists(apk):
              print("no tank_battle.tar.gz, skip cleanup"); raise SystemExit(0)
          try:
              buf = io.BytesIO()
              with tarfile.open(apk, "r:gz") as t:
                  members = t.getmembers()
                  kept = 0; skipped = 0
                  with tarfile.open(fileobj=buf, mode="w:gz") as out:
                      for m in members:
                          if m.name.startswith("assets/.workbuddy") or m.name == "assets/save.json":
                              skipped += 1; continue
                          out.addfile(m, t.extractfile(m)); kept += 1
                  print("kept", kept, "skipped", skipped)
              with open(apk, "wb") as f:
                  f.write(buf.getvalue())
          except Exception as e:
              print("tar cleanup failed (non-fatal):", repr(e))
          PY

      - name: Copy vendored runtime into build (same-origin)
        # 把 vendor/cdn 拷入 build/web/cdn，使运行时与游戏包全部同源托管在 Netlify。
        run: |
          cp -r vendor/cdn build/web/cdn

      - name: Patch index.html for auto-start
        run: |
          python3 scripts/patch_index.py build/web/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tank-battle-web
          path: ./build/web
