name: Build and Deploy Pygame to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygbag==0.9.3

      - name: Build with pygbag
        run: |
          python -m pygbag --build --app_name tank_battle --title "坦克大战" --can_close 1 .

      - name: Clean private files from build bundle
        # 统一归档名为 tank_battle，与页面 Python 模板 custom_site() 硬编码的 tank_battle.tar.gz 一致。
        # pygbag 在不同版本/环境下可能产出 中文名 / 连字符名 / 下划线名，这里全部归一到 tank_battle。
        run: |
          cd build/web
          for f in "坦克大战.apk" "tank-battle.apk" "tank_battle.apk"; do
            [ -f "$f" ] && [ "$f" != "tank_battle.apk" ] && mv -f "$f" "tank_battle.apk" || true
          done
          for f in "坦克大战.tar.gz" "tank-battle.tar.gz" "tank_battle.tar.gz"; do
            [ -f "$f" ] && [ "$f" != "tank_battle.tar.gz" ] && mv -f "$f" "tank_battle.tar.gz" || true
          done
          # 修正 index.html 中对中文文件名的引用
          python3 - <<'PY'
          p = "index.html"
          s = open(p, encoding="utf-8").read()
          for a, b in [('坦克大战.apk','tank_battle.apk'),('坦克大战.tar.gz','tank_battle.tar.gz'),
                       ('bundle = "坦克大战"','bundle = "tank_battle"'),('archive : "坦克大战"','archive : "tank_battle"')]:
              s = s.replace(a, b)
          open(p, "w", encoding="utf-8").write(s)
          print("index.html fixed")
          PY
          # 从压缩包内剔除 .workbuddy 记忆与真实存档
          python3 - <<'PY'
          import tarfile, io, os
          apk = "tank_battle.tar.gz"
          if not os.path.exists(apk):
              print("no tank_battle.tar.gz, skip cleanup"); raise SystemExit(0)
          try:
              buf = io.BytesIO()
              with tarfile.open(apk, "r:gz") as t:
                  members = t.getmembers()
                  kept = 0; skipped = 0
                  with tarfile.open(fileobj=buf, mode="w:gz") as out:
                      for m in members:
                          if m.name.startswith("assets/.workbuddy") or m.name == "assets/save.json":
                              skipped += 1; continue
                          out.addfile(m, t.extractfile(m)); kept += 1
                  print("kept", kept, "skipped", skipped)
              with open(apk, "wb") as f:
                  f.write(buf.getvalue())
          except Exception as e:
              print("tar cleanup failed (non-fatal):", repr(e))
          PY

      - name: Patch index.html for auto-start
        # 让游戏加载后自动启动，不再卡在 "等待点击"；并清理无效 allow feature 警告
        run: |
          python3 scripts/patch_index.py build/web/index.html

      - name: Copy vendored pygbag runtime into build
        # 将 vendor/cdn（0.9.3 运行时，已随仓库提交）拷入部署包，
        # 使页面从同源加载运行时，避免用户网络无法访问 pygame-web.github.io CDN 而整页打不开。
        run: |
          cp -r vendor/cdn build/web/cdn

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
